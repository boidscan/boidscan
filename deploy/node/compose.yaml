# A single boidscan node: Postgres, the web page with search on http://localhost:8080 and the scanner.
# Put BOIDSCAN_ABUSE_CONTACT=<your email address> in a .env file next to this one, then:
#   docker compose up -d
#   docker compose run --rm scan 203.0.113.5
# To take part in a flock, also set BOIDSCAN_ENDPOINT=http://<public IPv4> and BOIDSCAN_PORT=80,
# then: docker compose --profile sweep up -d

x-boidscan: &boidscan
  image: ghcr.io/boidscan/boidscan:0.0.6
  volumes: ["key:/keys"]
  environment: &boidscan-env
    BOIDSCAN_DB: postgres://boidscan:boidscan@db/boidscan?sslmode=disable
    BOIDSCAN_KEY_FILE: /keys/node.key
    BOIDSCAN_ABUSE_CONTACT: ${BOIDSCAN_ABUSE_CONTACT:?put BOIDSCAN_ABUSE_CONTACT=<your email address> in a .env file next to compose.yaml}
    BOIDSCAN_NODE_NAME: ${BOIDSCAN_NODE_NAME:-my-node}
    BOIDSCAN_ENDPOINT: ${BOIDSCAN_ENDPOINT:-}
    BOIDSCAN_SEEDS: ${BOIDSCAN_SEEDS:-}
    BOIDSCAN_LOG_LEVEL: ${BOIDSCAN_LOG_LEVEL:-INFO}

volumes:
  db:
  key:

services:
  db:
    image: postgres:17.6-bookworm
    # 25% of a 2 GB box; the 128MB default makes searches flush pages to disk.
    command: postgres -c shared_buffers=512MB
    environment:
      POSTGRES_USER: boidscan
      POSTGRES_PASSWORD: boidscan
      POSTGRES_DB: boidscan
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "boidscan"]
      interval: 2s
      retries: 30

  migrate:
    <<: *boidscan
    command: migrate
    depends_on:
      db:
        condition: service_healthy

  serve:
    <<: *boidscan
    command: serve
    ports: ["${BOIDSCAN_PORT:-8080}:80"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # zmap needs the host's own interface; it reaches Postgres through the published port.
  scan:
    <<: *boidscan
    profiles: [scan]
    network_mode: host
    entrypoint: ["boidscan", "scan"]
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      <<: *boidscan-env
      BOIDSCAN_DB: postgres://boidscan:boidscan@127.0.0.1:5432/boidscan?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *boidscan
    profiles: [sweep]
    network_mode: host
    command: worker
    cap_add: [NET_RAW, NET_ADMIN]
    restart: unless-stopped
    environment:
      <<: *boidscan-env
      BOIDSCAN_DB: postgres://boidscan:boidscan@127.0.0.1:5432/boidscan?sslmode=disable
    depends_on:
      serve:
        condition: service_started
