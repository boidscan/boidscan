# Isolated lab: three boids that find each other through a DNS seed, their
# workers, and targets. Nothing outside this network is scanned.
#   ./flock.sh            start the flock and watch it
#   ./flock.sh sweep      start the flock and its workers and watch the sweep
#   ./e2e.sh              scan the targets and check results and the flock
#   curl localhost:8080/fed/v1/peers

x-boid: &boid
  build: ../..
  image: boidscan:lab
  entrypoint: ["sh", "-c", "boidscan migrate && exec boidscan serve"]
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]
    interval: 1s
    retries: 60
  depends_on:
    db:
      condition: service_healthy

# Every boid also answers to seeds.boidscan.lab, so that DNS seed resolves to all of them.
x-boid-env: &boid-env
  BOIDSCAN_PROJECT_URL: https://boidscan.network
  BOIDSCAN_ABUSE_CONTACT: abuse@lab.invalid
  BOIDSCAN_KEY_FILE: /keys/node.key
  BOIDSCAN_SEEDS: seeds.boidscan.lab
  BOIDSCAN_GOSSIP_INTERVAL: 1s
  BOIDSCAN_LAB: "true"
  BOIDSCAN_LAB_RANGE: 172.30.0.0/26
  # Set by lib.sh from the lab maintainer key in ./policy.
  BOIDSCAN_POLICY_ROOT: ${LAB_POLICY_ROOT:-}
  BOIDSCAN_POLICY_URL: ""
  BOIDSCAN_LEASE_TTL: 30s

# A worker shares its boid's network namespace, so it scans from the boid's endpoint address.
x-worker: &worker
  image: boidscan:lab
  profiles: [sweep]
  command: worker -ip-layer -interface eth0 -rate 1000 -cooldown 1 -idle 2s
  cap_add: [NET_RAW, NET_ADMIN]

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  certs:
  key-a:
  key-b:
  key-c:

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: boidscan
      POSTGRES_PASSWORD: boidscan
      POSTGRES_DB: boid_a
    volumes:
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      # TCP, because the init scripts run on a socket-only server first.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "boidscan", "-d", "boid_a"]
      interval: 2s
      retries: 30
    networks:
      lab:
        ipv4_address: 172.30.0.2

  boid-a:
    <<: *boid
    environment: &boid-a-env
      <<: *boid-env
      BOIDSCAN_DB: postgres://boidscan:boidscan@db/boid_a?sslmode=disable
      BOIDSCAN_NODE_NAME: boid-a
      BOIDSCAN_ENDPOINT: http://172.30.0.3
      BOIDSCAN_DEBUG_LOG: /logs/boid-a.jsonl
    volumes: ["./logs:/logs", "key-a:/keys"]
    ports: ["${LAB_PORT:-8080}:80"]
    networks:
      lab:
        ipv4_address: 172.30.0.3
        aliases: [seeds.boidscan.lab]

  boid-b:
    <<: *boid
    environment: &boid-b-env
      <<: *boid-env
      BOIDSCAN_DB: postgres://boidscan:boidscan@db/boid_b?sslmode=disable
      BOIDSCAN_NODE_NAME: boid-b
      BOIDSCAN_ENDPOINT: http://172.30.0.5
      BOIDSCAN_DEBUG_LOG: /logs/boid-b.jsonl
    volumes: ["./logs:/logs", "key-b:/keys"]
    ports: ["8081:80"]
    networks:
      lab:
        ipv4_address: 172.30.0.5
        aliases: [seeds.boidscan.lab]

  boid-c:
    <<: *boid
    environment: &boid-c-env
      <<: *boid-env
      BOIDSCAN_DB: postgres://boidscan:boidscan@db/boid_c?sslmode=disable
      BOIDSCAN_NODE_NAME: boid-c
      BOIDSCAN_ENDPOINT: http://172.30.0.6
      BOIDSCAN_DEBUG_LOG: /logs/boid-c.jsonl
    volumes: ["./logs:/logs", "key-c:/keys"]
    ports: ["8082:80"]
    networks:
      lab:
        ipv4_address: 172.30.0.6
        aliases: [seeds.boidscan.lab]

  worker-a:
    <<: *worker
    network_mode: service:boid-a
    environment:
      <<: *boid-a-env
      BOIDSCAN_DEBUG_LOG: /logs/worker-a.jsonl
    volumes: ["./logs:/logs", "key-a:/keys"]
    depends_on:
      boid-a:
        condition: service_healthy

  worker-b:
    <<: *worker
    network_mode: service:boid-b
    environment:
      <<: *boid-b-env
      BOIDSCAN_DEBUG_LOG: /logs/worker-b.jsonl
    volumes: ["./logs:/logs", "key-b:/keys"]
    depends_on:
      boid-b:
        condition: service_healthy

  worker-c:
    <<: *worker
    network_mode: service:boid-c
    environment:
      <<: *boid-c-env
      BOIDSCAN_DEBUG_LOG: /logs/worker-c.jsonl
    volumes: ["./logs:/logs", "key-c:/keys"]
    depends_on:
      boid-c:
        condition: service_healthy

  # A manual scan on behalf of boid-a, or of the boid in SCAN_BOID (a, b or c):
  # same database and key, so its results are signed by that boid.
  scan:
    image: boidscan:lab
    profiles: [scan]
    command: scan -lab -ip-layer -interface eth0 -rate 200 -ports 22,80,443,2200,6379,9443 172.30.0.0/24
    environment:
      <<: *boid-env
      BOIDSCAN_DB: postgres://boidscan:boidscan@db/boid_${SCAN_BOID:-a}?sslmode=disable
      BOIDSCAN_NODE_NAME: boid-${SCAN_BOID:-a}-scan
      BOIDSCAN_DEBUG_LOG: /logs/boid-${SCAN_BOID:-a}-scan.jsonl
    volumes: ["./logs:/logs", "key-${SCAN_BOID:-a}:/keys"]
    cap_add: [NET_RAW, NET_ADMIN]
    depends_on:
      boid-a:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.30.0.4

  certgen:
    image: alpine:3.22.1
    command: sh -c "apk add --no-cache openssl >/dev/null && [ -f /certs/cert.pem ] || openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=web.lab.test -addext subjectAltName=DNS:web.lab.test,DNS:www.lab.test -keyout /certs/key.pem -out /certs/cert.pem"
    volumes: ["certs:/certs"]

  web:
    image: nginx:1.29.1-alpine
    volumes:
      - certs:/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
    networks:
      lab:
        ipv4_address: 172.30.0.10

  sshd:
    image: alpine:3.22.1
    command: sh -c "apk add --no-cache openssh >/dev/null && ssh-keygen -A && exec /usr/sbin/sshd -D -e -p 22 -p 2200"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 2s
      retries: 60
    networks:
      lab:
        ipv4_address: 172.30.0.11

  redis:
    image: redis:8.2.1-alpine
    networks:
      lab:
        ipv4_address: 172.30.0.12
