# Isolated lab: boidscan scans only the containers on this network.
#   docker compose -f deploy/lab/compose.yaml up -d --build
#   docker compose -f deploy/lab/compose.yaml run --rm scan
#   curl localhost:8080/api/v1/host/172.30.0.10

x-boidscan-env: &boidscan-env
  BOIDSCAN_DB: postgres://boidscan:boidscan@db/boidscan?sslmode=disable
  BOIDSCAN_PROJECT_URL: https://boidscan.network
  BOIDSCAN_ABUSE_CONTACT: abuse@lab.invalid
  BOIDSCAN_NODE_ID: lab-node-1

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  certs:

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: boidscan
      POSTGRES_PASSWORD: boidscan
      POSTGRES_DB: boidscan
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "boidscan"]
      interval: 2s
      retries: 30
    networks:
      lab:
        ipv4_address: 172.30.0.2

  migrate:
    build: ../..
    command: migrate
    environment: *boidscan-env
    depends_on:
      db:
        condition: service_healthy
    networks: [lab]

  serve:
    build: ../..
    command: serve
    environment: *boidscan-env
    ports: ["${LAB_PORT:-8080}:80"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      lab:
        ipv4_address: 172.30.0.3

  scan:
    build: ../..
    profiles: [scan]
    command: scan -lab -ip-layer -interface eth0 -rate 200 -ports 22,80,443,2200,6379,9443 172.30.0.0/24
    environment: *boidscan-env
    cap_add: [NET_RAW, NET_ADMIN]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      lab:
        ipv4_address: 172.30.0.4

  certgen:
    image: alpine:3.22.1
    command: sh -c "apk add --no-cache openssl >/dev/null && [ -f /certs/cert.pem ] || openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=web.lab.test -addext subjectAltName=DNS:web.lab.test,DNS:www.lab.test -keyout /certs/key.pem -out /certs/cert.pem"
    volumes: ["certs:/certs"]

  web:
    image: nginx:1.29.1-alpine
    volumes:
      - certs:/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
    networks:
      lab:
        ipv4_address: 172.30.0.10

  sshd:
    image: alpine:3.22.1
    command: sh -c "apk add --no-cache openssh >/dev/null && ssh-keygen -A && exec /usr/sbin/sshd -D -e -p 22 -p 2200"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 2s
      retries: 60
    networks:
      lab:
        ipv4_address: 172.30.0.11

  redis:
    image: redis:8.2.1-alpine
    networks:
      lab:
        ipv4_address: 172.30.0.12
